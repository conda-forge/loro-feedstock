schema_version: 1

context:
  name: loro
  version: "1.17.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/loro-${{ version }}.tar.gz
  sha256: 6971727a12ef2d8c232e3ad54d9d00a3fbd04774d13b0ae0e744d0a60b651843

build:
  number: 1
  script:
    env:
      # loro 1.17.1 pins PyO3 0.26, which caps at Python 3.14; build via the stable ABI on newer Pythons
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin >=1.8,<2.0
    - cargo-bundle-licenses
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
  host:
    - python
    - maturin >=1.8,<2.0
    - pip
    - rust
  run:
    - python

tests:
  - python:
      imports:
        - loro
      pip_check: true

about:
  summary: Python bindings for [Loro](https://loro.dev)
  homepage: https://loro.dev
  license: MIT
  license_file:
    - THIRDPARTY.yml
    - LICENSE

extra:
  recipe-maintainers:
    - AH-Merii
    - Leeeon233
    - carlodri
